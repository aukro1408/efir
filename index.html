<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1116">
<title>Эфир</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{
  --bg:#0c1116; --surface:#151c25; --surface2:#1b2430; --tile:#0a0e13;
  --line:rgba(255,255,255,.07);
  --txt:#f2f5f9; --muted:#93a1b3; --faint:#5d6b7d;
  --acc:#3d9df2; --acc-dim:rgba(61,157,242,.16);
  --danger:#ff6b6b; --ok:#4ade80;
  --r:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:15px;min-height:100dvh;padding-bottom:76px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(12,17,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:19px;letter-spacing:.14em}
.logo span{color:var(--acc)}
.topbar .sp{flex:1}
.icobtn{width:38px;height:38px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.icobtn svg{width:19px;height:19px;stroke:var(--txt)}

/* ---------- tabs content ---------- */
.wrap{max-width:720px;margin:0 auto;padding:0 12px}
.tab{display:none}
.tab.on{display:block}

.search{position:sticky;top:61px;z-index:15;background:var(--bg);padding:10px 4px 6px}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--txt);outline:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--acc)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
.chip.on{background:var(--acc-dim);border-color:var(--acc);color:var(--txt)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.card:active{transform:scale(.97)}
.card .tile{background:var(--tile);border-radius:9px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .tile img{max-width:82%;max-height:82%;object-fit:contain}
.card .tile .ini{font-size:26px;font-weight:800;color:var(--acc)}
.card .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.card .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.fav{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:10px;background:rgba(10,14,19,.72);display:flex;align-items:center;justify-content:center}
.fav svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2}
.fav.on svg{fill:var(--danger);stroke:var(--danger)}

.empty{padding:48px 20px;text-align:center;color:var(--faint);font-size:14px;line-height:1.6}

/* ---------- guide ---------- */
.grow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;margin-bottom:10px;align-items:center;text-align:left;width:100%}
.grow .gtile{flex:0 0 64px;height:44px;background:var(--tile);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.grow .gtile img{max-width:85%;max-height:85%;object-fit:contain}
.grow .gtile .ini{font-weight:800;color:var(--acc)}
.grow .gi{min-width:0;flex:1}
.grow .gn{font-size:13px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gp{font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gp b{color:var(--acc);font-weight:600;margin-right:6px}
.grow .gn2{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.grow .gbar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.grow .gbar i{display:block;height:100%;background:var(--acc)}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.player.on{display:flex}
.pv{position:relative;background:#000;aspect-ratio:16/9;max-height:46dvh}
.pv video{width:100%;height:100%;background:#000}
.pclose{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:18px;z-index:2}
.pinfo{flex:1;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;margin-top:-18px;position:relative;padding:22px 18px 30px}
.pch{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.pch .ptile{width:64px;height:44px;background:var(--tile);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.pch .ptile img{max-width:85%;max-height:85%;object-fit:contain}
.pch .ptile .ini{font-weight:800;color:var(--acc);font-size:20px}
.pch .pnm{font-size:17px;font-weight:800}
.pnow{font-size:14px;margin:10px 0 2px}
.pnow b{color:var(--acc)}
.pnext{font-size:13px;color:var(--muted)}
.pbar{height:4px;border-radius:3px;background:rgba(255,255,255,.09);margin:12px 0;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc)}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pbtn{padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13.5px;font-weight:700}
.pbtn.pri{background:var(--acc);border-color:var(--acc);color:#04121f}
.plist{margin-top:6px}
.plist h4{margin:14px 0 8px;font-size:12px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.prow{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.prow .t{color:var(--acc);font-weight:700;flex:0 0 52px;font-size:12.5px}
.prow.cur .t{color:var(--ok)}
.prow .tt{min-width:0}
.prow .tt small{display:block;color:var(--faint);font-size:11.5px;margin-top:2px}
.pext{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;font-size:14px;line-height:1.65;color:var(--muted)}
.pext b{color:var(--txt)}

/* ---------- settings ---------- */
.set{padding:14px 4px 30px}
.set h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:20px 0 10px}
.plrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.plrow .dot{width:10px;height:10px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.plrow.on .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.plrow .pn{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plrow .pn small{display:block;color:var(--faint);font-weight:400;font-size:11px;margin-top:2px}
.plrow .del{color:var(--faint);font-size:18px;padding:4px 8px}
.addbox{background:var(--surface);border:1px dashed rgba(255,255,255,.16);border-radius:var(--r);padding:14px}
.addbox input{width:100%;background:var(--tile);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);margin-bottom:8px;outline:none}
.addbox input:focus{border-color:var(--acc)}
.btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--acc);color:#04121f;font-weight:800;font-size:15px;margin-top:4px}
.btn.ghost{background:var(--surface2);color:var(--txt);border:1px solid var(--line)}
.note{font-size:12px;color:var(--faint);line-height:1.6;margin-top:10px}
.ver{text-align:center;color:var(--faint);font-size:12px;margin-top:26px}

/* ---------- bottom nav ---------- */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(12,17,22,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:720px;margin:0 auto;display:flex}
.navi{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--faint);font-size:10.5px;font-weight:600}
.navi svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.navi.on{color:var(--acc)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#222c38;border:1px solid var(--line);color:var(--txt);padding:11px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:46px;height:46px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--acc);border-radius:50%;margin:60px auto;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-in">
  <div class="logo">ЭФИР<span>.</span></div><div class="sp"></div>
  <button class="icobtn" id="tbSearch" aria-label="Поиск"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
  <button class="icobtn" id="tbSet" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.01a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.01a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.01a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
</div></div>

<div class="wrap">
  <div class="tab on" id="tab-channels">
    <div class="search" id="searchBox" style="display:none"><input id="q" placeholder="Поиск канала…" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="chEmpty" style="display:none"></div>
  </div>
  <div class="tab" id="tab-guide"><div style="height:12px"></div><div id="guide"></div></div>
  <div class="tab" id="tab-favs"><div style="height:12px"></div><div class="grid" id="favGrid"></div><div class="empty" id="favEmpty" style="display:none">Нажимай на сердечко у канала —<br>и он появится здесь.</div></div>
  <div class="tab" id="tab-settings"><div class="set" id="settings"></div></div>
</div>

<div class="player" id="player">
  <div class="pv"><video id="video" controls playsinline></video><button class="pclose" id="pclose">✕</button></div>
  <div class="pinfo" id="pinfo"></div>
</div>

<div class="navbar"><div class="nav-in" id="nav"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>(s||"").toLowerCase().replace(/[^a-z0-9а-яё]/gi,"");
const normLoose=s=>norm(s).replace(/^(телеканал|канал|тв)/,"").replace(/(тв|tv|channel)$/,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2400)}
const fmtT=ts=>{const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};

/* ================= store ================= */
const LS="efir.v1";
let S={playlists:[],active:-1,favs:[],epgOverride:""};
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

/* ================= state ================= */
let channels=[], groups=[], activeGroup="Все", query="";
let epgById={}, epgByNorm={}, epgCount=0;
let hls=null, curCh=null;

/* ================= loader: direct, then one quiet fallback ================= */
async function bufOf(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error("http "+r.status);
  return await r.arrayBuffer();
}
function gunzipMaybe(buf){
  const b=new Uint8Array(buf);
  if(b.length>2&&b[0]===0x1f&&b[1]===0x8b&&typeof DecompressionStream!=="undefined"){
    const ds=new DecompressionStream("gzip");
    const w=ds.writable.getWriter();w.write(buf);w.close();
    return new Response(ds.readable).arrayBuffer();
  }
  return Promise.resolve(buf);
}
async function loadText(url,marker){
  const ok=t=>t&&t.length>40&&(!marker||t.indexOf(marker)>=0);
  const seq=[url];
  if(url.startsWith("http://")) seq.push("https://"+url.slice(7));
  for(const u of seq){try{const b=await bufOf(u);const t=new TextDecoder().decode(await gunzipMaybe(b));if(ok(t))return t}catch(e){}}
  const fb=["https://api.cors.lol/?url=","https://api.allorigins.win/raw?url="];
  for(const p of fb){try{const b=await bufOf(p+encodeURIComponent(url));
    const t=new TextDecoder().decode(await gunzipMaybe(b));
    if(ok(t)) return t}catch(e){}}
  throw new Error("load failed");
}

/* ================= M3U ================= */
function splitExtinf(line){
  // ищет запятую-разделитель, пропуская запятые внутри "кавычек"
  let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"')q=!q;
    else if(c===','&&!q)return i;
  }
  return line.indexOf(",");
}
function parseM3U(text){
  text=text.replace(/^\uFEFF/,"");
  const out=[];let meta=null,tvgUrl=null;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    if(line.startsWith("#EXTM3U")){
      const m=line.match(/(?:url-tvg|x-tvg-url)="([^"]+)"/i);if(m)tvgUrl=m[1];continue;
    }
    if(line.startsWith("#EXTINF")){
      const a={};const re=/([\w-]+)="([^"]*)"/g;let m;
      while((m=re.exec(line)))a[m[1].toLowerCase()]=m[2];
      const ci=splitExtinf(line);
      const nm=(ci>=0?line.slice(ci+1):"").trim()||"Без названия";
      meta={name:nm,id:a["tvg-id"]||"",logo:a["tvg-logo"]||"",
        group:(a["group-title"]||"").trim()||"Разное",
        catchup:a["catchup"]||"",cdays:a["catchup-days"]||"",csrc:a["catchup-source"]||""};
      continue;
    }
    if(line.startsWith("#"))continue;
    if(meta){out.push(Object.assign(meta,{url:line}));meta=null}
  }
  return{channels:out,tvgUrl};
}

/* ================= XMLTV ================= */
function xTime(s){
  if(!s)return null;const m=String(s).match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?/);
  if(!m)return null;const Y=m[1],Mo=m[2],D=m[3],h=m[4],mi=m[5],se=m[6],off=m[7];
  let d=Date.UTC(+Y,+Mo-1,+D,+h,+mi,+se);
  if(off){const sg=off[0]==="-"?-1:1;d-=sg*((+off.slice(1,3))*60+(+off.slice(3,5)))*60000}
  return d;
}
function parseXMLTV(xml){
  const byId={},byNorm={};let n=0;
  let doc;try{doc=new DOMParser().parseFromString(xml,"text/xml")}catch(e){return{byId,byNorm,n}}
  if(doc.querySelector("parsererror"))return{byId,byNorm,n};
  const names={};
  const chEls=doc.querySelectorAll("channel");
  for(let i=0;i<chEls.length;i++){
    const c=chEls[i],id=c.getAttribute("id");if(!id)continue;
    const dn=c.querySelector("display-name");
    if(dn&&dn.textContent.trim())names[id]=dn.textContent.trim();
  }
  const prEls=doc.querySelectorAll("programme");
  for(let i=0;i<prEls.length;i++){
    const p=prEls[i],ch=p.getAttribute("channel");if(!ch)continue;
    const s=xTime(p.getAttribute("start")),e=xTime(p.getAttribute("stop"));if(!s)continue;
    const te=p.querySelector("title"),de=p.querySelector("desc");
    const title=te&&te.textContent?te.textContent.trim():"";
    if(!title)continue;
    const desc=de&&de.textContent?de.textContent.trim():"";
    (byId[ch]=byId[ch]||[]).push({s:s,e:e||s+3600e3,title:title,desc:desc});n++;
  }
  for(const k in byId)byId[k].sort((a,b)=>a.s-b.s);
  for(const id in byId){
    const nm=names[id];if(!nm)continue;
    const k1=norm(nm),k2=normLoose(nm);
    if(k1&&!byNorm[k1])byNorm[k1]=byId[id];
    if(k2&&k2!==k1&&!byNorm[k2])byNorm[k2]=byId[id];
  }
  return{byId:byId,byNorm:byNorm,n:n};
}
function epgFor(ch){
  if(ch.id&&epgById[ch.id])return epgById[ch.id];
  const k1=norm(ch.name),k2=normLoose(ch.name);
  if(epgByNorm[k1])return epgByNorm[k1];
  if(k2&&epgByNorm[k2])return epgByNorm[k2];
  if(k1.length>3)for(const k in epgByNorm){
    if(k.length>3&&(k.indexOf(k1)>=0||k1.indexOf(k)>=0))return epgByNorm[k];
  }
  return null;
}
function nowNext(p){
  if(!p||!p.length)return null;const t=Date.now();let cur=null,nxt=null;
  for(let i=0;i<p.length;i++){
    const e=p[i].e||p[i].s+3600e3;
    if(p[i].s<=t&&t<e){cur=p[i];nxt=p[i+1]||null;break}
    if(p[i].s>t){nxt=p[i];break}
  }
  return{cur:cur,nxt:nxt};
}

/* ================= boot ================= */
async function boot(){
  renderNav();renderSettings();
  if(S.active<0||!S.playlists[S.active]){switchTab("settings");return}
  await loadAll();
}
async function loadAll(){
  const pl=S.playlists[S.active];
  $("#grid").innerHTML='<div class="spin"></div>';$("#chEmpty").style.display="none";
  try{
    const m3u=await loadText(pl.url,"#EXT");
    const pr=parseM3U(m3u);
    channels=pr.channels;
    const gs={};pr.channels.forEach(c=>gs[c.group]=1);
    groups=["Все"].concat(Object.keys(gs));
    activeGroup="Все";query="";$("#q").value="";
    renderChips();renderGrid();
    loadEPG(pr.tvgUrl).then(()=>{renderGrid();renderGuide()});
  }catch(e){
    $("#grid").innerHTML="";
    const em=$("#chEmpty");em.style.display="block";
    em.innerHTML="Не получилось загрузить плейлист.<br>Проверь ссылку в настройках.";
  }
}
async function loadEPG(tvgUrl){
  epgById={};epgByNorm={};epgCount=0;
  const url=(S.epgOverride||"").trim()||tvgUrl;
  if(!url)return;
  try{
    const xml=await loadText(url,"<tv");
    const r=parseXMLTV(xml);
    epgById=r.byId;epgByNorm=r.byNorm;epgCount=r.n;
  }catch(e){}
}

/* ================= channels tab ================= */
function renderChips(){
  $("#chips").innerHTML=groups.map(g=>
    `<button class="chip${g===activeGroup?" on":""}" data-g="${esc(g)}">${esc(g)}</button>`).join("");
  const bs=$("#chips").querySelectorAll(".chip");
  for(let i=0;i<bs.length;i++)bs[i].onclick=()=>{activeGroup=bs[i].dataset.g;renderChips();renderGrid()};
}
function filtered(){
  const q=norm(query);
  return channels.filter(c=>(activeGroup==="Все"||c.group===activeGroup)&&(!q||norm(c.name).indexOf(q)>=0));
}
function logoTile(ch,cls){
  const nm=(ch.name||"").trim();
  const ini=esc((nm.charAt(0)||"•").toUpperCase());
  const img=ch.logo?`<img src="${esc(ch.logo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display=''">`:"";
  return `<div class="${cls}">${img}<span class="ini"${img?' style="display:none"':""}>${ini}</span></div>`;
}
function cardHTML(c,i,withProg){
  const nn=nowNext(epgFor(c));
  const pr=nn&&nn.cur?nn.cur.title:"";
  const pct=nn&&nn.cur?Math.min(100,Math.max(0,(Date.now()-nn.cur.s)/((nn.cur.e||nn.cur.s+3600e3)-nn.cur.s)*100)):0;
  const fv=S.favs.indexOf(c.url)>=0;
  return `<button class="card" data-i="${i}">
    <span class="fav${fv?" on":""}" data-f="${i}"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.2-4.7-9.3-8.8C1.2 8.7 3 5.4 6.3 5.4c1.9 0 3.2 1 4 2.2h3.4c.8-1.2 2.1-2.2 4-2.2 3.3 0 5.1 3.3 3.6 6.3-2.1 4.1-9.3 8.8-9.3 8.8z"/></svg></span>
    ${logoTile(c,"tile")}
    <span class="nm">${esc(c.name)}</span>
    ${withProg?`<span class="pr">${esc(pr)}</span><span class="bar"><i style="width:${pct}%"></i></span>`:""}
  </button>`;
}
function renderGrid(){
  const list=filtered();
  $("#grid").innerHTML=list.map(c=>cardHTML(c,channels.indexOf(c),true)).join("");
  const em=$("#chEmpty");
  if(!list.length){em.style.display="block";em.textContent=channels.length?"Ничего не найдено.":"Плейлист пуст."}
  else em.style.display="none";
  bindCards($("#grid"));
}
function bindCards(root){
  const els=root.querySelectorAll(".card");
  for(let i=0;i<els.length;i++)els[i].onclick=e=>{
    const f=e.target.closest("[data-f]");
    if(f){e.stopPropagation();toggleFav(channels[+f.dataset.f].url);return}
    openPlayer(channels[+els[i].dataset.i]);
  };
}
function toggleFav(url){
  const i=S.favs.indexOf(url);
  if(i>=0)S.favs.splice(i,1);else S.favs.push(url);
  save();renderGrid();renderFavs();
}

/* ================= guide tab ================= */
function renderGuide(){
  const box=$("#guide");
  const withEpg=channels.filter(c=>epgFor(c));
  if(!withEpg.length){box.innerHTML=`<div class="empty">Программа появится,<br>когда загрузится телегид.</div>`;return}
  const t=Date.now();let html="";
  for(let k=0;k<withEpg.length;k++){
    const c=withEpg[k],nn=nowNext(epgFor(c));
    if(!nn||!nn.cur)continue;
    const pct=Math.min(100,Math.max(0,(t-nn.cur.s)/((nn.cur.e||nn.cur.s+3600e3)-nn.cur.s)*100));
    html+=`<button class="grow" data-u="${esc(c.url)}">
      ${logoTile(c,"gtile")}
      <span class="gi"><span class="gn">${esc(c.name)}</span>
      <span class="gp"><b>${fmtT(nn.cur.s)}</b>${esc(nn.cur.title)}</span>
      ${nn.nxt?`<span class="gn2">${fmtT(nn.nxt.s)} · ${esc(nn.nxt.title)}</span>`:""}
      <span class="gbar"><i style="width:${pct}%"></i></span></span>
    </button>`;
  }
  box.innerHTML=html||`<div class="empty">Сейчас в эфире ничего нет.</div>`;
  const bs=box.querySelectorAll(".grow");
  for(let i=0;i<bs.length;i++)bs[i].onclick=()=>{
    for(let j=0;j<channels.length;j++)if(channels[j].url===bs[i].dataset.u){openPlayer(channels[j]);break}
  };
}

/* ================= favorites ================= */
function renderFavs(){
  const list=channels.filter(c=>S.favs.indexOf(c.url)>=0);
  $("#favGrid").innerHTML=list.map(c=>cardHTML(c,channels.indexOf(c),false)).join("");
  $("#favEmpty").style.display=list.length?"none":"block";
  bindCards($("#favGrid"));
}

/* ================= player ================= */
function stopStream(){
  try{if(hls){hls.destroy();hls=null}}catch(e){}
  const v=$("#video");v.onerror=null;try{v.pause()}catch(e){}
  v.removeAttribute("src");v.load();
}
function openPlayer(ch,fromStart){
  curCh=ch;
  const nn=nowNext(epgFor(ch));
  let raw=ch.url,catchupUsed=false;
  if(fromStart&&ch.catchup&&nn&&nn.cur){
    const u=Math.floor(nn.cur.s/1000),l=Math.floor(Date.now()/1000);
    raw=ch.url+(ch.url.indexOf("?")>=0?"&":"?")+"utc="+u+"&lutc="+l;
    catchupUsed=true;
  }
  const wasHttp=raw.indexOf("http://")===0;
  $("#player").classList.add("on");document.body.style.overflow="hidden";
  renderPInfo(ch,nn,catchupUsed,"",wasHttp);
  wirePButtons(ch);
  const cands=wasHttp?["https://"+raw.slice(7)]:[raw];
  tryCandidate(ch,cands,0,wasHttp);
}
function tryCandidate(ch,cands,i,wasHttp){
  if(i>=cands.length){
    renderPInfo(ch,nowNext(epgFor(ch)),false,"fail",wasHttp);
    wirePButtons(ch);return;
  }
  const url=cands[i];
  const st=$("#pstat");if(st)st.textContent="Соединяю…";
  stopStream();
  const v=$("#video");
  // прямые не-HLS форматы играем нативно, всё остальное (в т.ч. без расширения .m3u8 в ссылке — так отдают многие провайдеры) — через hls.js
  const isDirect=/\.(mp4|webm|mkv|mov|m4v)(\?|#|$)/i.test(url);
  if(!isDirect&&window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30});
    hls.on(Hls.Events.ERROR,(ev,d)=>{
      if(!d.fatal)return;
      // если hls.js не смог разобрать поток как HLS — пробуем как обычное видео, прежде чем сдаться
      if(d.details==="manifestParsingError"||d.details==="manifestLoadError"){
        try{hls.destroy()}catch(e){}
        hls=null;v.onerror=()=>tryCandidate(ch,cands,i+1,wasHttp);v.src=url;v.play().catch(()=>{});
        return;
      }
      tryCandidate(ch,cands,i+1,wasHttp);
    });
    hls.loadSource(url);hls.attachMedia(v);
  }else{
    v.onerror=()=>tryCandidate(ch,cands,i+1,wasHttp);
    v.src=url;
  }
  v.play().catch(()=>{});
}
function renderPInfo(ch,nn,catchupUsed,mode,wasHttp){
  const info=$("#pinfo");
  const pct=nn&&nn.cur?Math.min(100,Math.max(0,(Date.now()-nn.cur.s)/((nn.cur.e||nn.cur.s+3600e3)-nn.cur.s)*100)):0;
  const canStart=!!(ch.catchup&&nn&&nn.cur&&(Date.now()-nn.cur.s>90000));
  const plist=(epgFor(ch)||[]).filter(p=>(p.e||p.s+3600e3)>Date.now()-3600e3).slice(0,12);
  let h=`<div class="pch">${logoTile(ch,"ptile")}<div><div class="pnm">${esc(ch.name)}</div>
    <div style="font-size:12px;color:var(--faint)">${esc(ch.group)}${catchupUsed?' · <span style="color:var(--ok)">сначала</span>':""}</div></div></div>`;
  if(nn&&nn.cur)h+=`<div class="pnow"><b>${fmtT(nn.cur.s)}–${fmtT(nn.cur.e||nn.cur.s+3600e3)}</b> · ${esc(nn.cur.title)}</div>`;
  if(nn&&nn.nxt)h+=`<div class="pnext">Далее: ${fmtT(nn.nxt.s)} · ${esc(nn.nxt.title)}</div>`;
  if(nn&&nn.cur)h+=`<div class="pbar"><i style="width:${pct}%"></i></div>`;
  h+=`<div class="pbtns">${canStart?`<button class="pbtn pri" id="bStart">▶ Сначала</button>`:""}<button class="pbtn" id="bCopy">Ссылка</button><button class="pbtn" id="bShare">Поделиться</button></div><div id="pstat" style="font-size:12.5px;color:var(--faint);min-height:18px;margin-bottom:4px"></div>`;
  if(mode==="fail")h+=`<div class="pext"><b>Не получилось показать в приложении.</b><br>${wasHttp?"Провайдер отдаёт поток только по http, а защищённая версия не отвечает — браузер такое блокирует, это не поломка.":"Поток не отвечает."}<br>Открой ссылку во внешнем плеере: VLC или MX Player подхватят её сами.</div>`;
  if(plist.length){
    h+=`<div class="plist"><h4>Программа</h4>`;
    for(let i=0;i<plist.length;i++){const p=plist[i];
      const cur=nn&&nn.cur&&p.s===nn.cur.s;
      h+=`<div class="prow${cur?" cur":""}"><span class="t">${fmtT(p.s)}</span><span class="tt">${esc(p.title)}${p.desc?`<small>${esc(p.desc.slice(0,140))}</small>`:""}</span></div>`;
    }
    h+=`</div>`;
  }
  info.innerHTML=h;
}
function wirePButtons(ch){
  $("#bCopy").onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(ch.url).then(()=>toast("Ссылка скопирована")).catch(()=>toast("Не вышло скопировать"));else toast("Копирование недоступно")};
  $("#bShare").onclick=()=>{if(navigator.share)navigator.share({title:ch.name,url:ch.url}).catch(()=>{});else $("#bCopy").click()};
  const bs=$("#bStart");if(bs)bs.onclick=()=>openPlayer(ch,true);
}
$("#pclose").onclick=()=>{$("#player").classList.remove("on");document.body.style.overflow="";stopStream();curCh=null};

/* ================= settings ================= */
function shortUrl(u){try{const x=new URL(u);return x.host+x.pathname.slice(0,26)}catch(e){return String(u).slice(0,40)}}
function renderSettings(){
  const el=$("#settings");
  let rows="";
  for(let i=0;i<S.playlists.length;i++){const p=S.playlists[i];
    rows+=`<div class="plrow${i===S.active?" on":""}" data-i="${i}">
      <span class="dot"></span>
      <span class="pn">${esc(p.name)}<small>${esc(shortUrl(p.url))}</small></span>
      <button class="del" data-d="${i}" aria-label="Удалить">×</button>
    </div>`;
  }
  el.innerHTML=`
    <h3>Плейлисты</h3>
    <div id="plList">${rows||'<div class="note">Пока пусто — добавь первый плейлист ниже.</div>'}</div>
    <div class="addbox" style="margin-top:10px">
      <input id="plName" placeholder="Название — например, Мой ТВ" autocomplete="off">
      <input id="plUrl" placeholder="Ссылка на m3u…" inputmode="url" autocomplete="off">
      <button class="btn" id="plAdd">Добавить</button>
    </div>
    <h3>Телепрограмма</h3>
    <div class="addbox">
      <input id="epgUrl" placeholder="Ссылка на XMLTV (необязательно)" inputmode="url" value="${esc(S.epgOverride)}" autocomplete="off">
      <button class="btn ghost" id="epgSave">Сохранить</button>
      <div class="note">Если пусто — адрес берётся из самого плейлиста (url-tvg).${epgCount?`<br>Загружено передач: <b style="color:var(--txt)">${epgCount}</b>`:""}</div>
    </div>
    <h3>Данные</h3>
    <button class="btn ghost" id="btnReload">Обновить каналы и программу</button>
    <div class="ver">Эфир 2.0 · собрано с ноля</div>`;
  const rs=el.querySelectorAll(".plrow");
  for(let i=0;i<rs.length;i++)rs[i].onclick=e=>{
    if(e.target.closest("[data-d]"))return;
    S.active=+rs[i].dataset.i;save();renderSettings();loadAll();
  };
  const ds=el.querySelectorAll("[data-d]");
  for(let i=0;i<ds.length;i++)ds[i].onclick=e=>{
    e.stopPropagation();
    S.playlists.splice(+ds[i].dataset.d,1);
    if(S.active>=S.playlists.length)S.active=S.playlists.length-1;
    save();renderSettings();if(S.active>=0)loadAll();
  };
  $("#plAdd").onclick=()=>{
    const name=$("#plName").value.trim()||"Плейлист "+(S.playlists.length+1);
    const url=$("#plUrl").value.trim();
    if(!url){toast("Вставь ссылку");return}
    S.playlists.push({name:name,url:url});S.active=S.playlists.length-1;
    save();renderSettings();loadAll();toast("Плейлист добавлен");
  };
  $("#epgSave").onclick=()=>{S.epgOverride=$("#epgUrl").value.trim();save();renderSettings();loadAll();toast("Сохранено")};
  $("#btnReload").onclick=()=>{if(S.active>=0)loadAll();else toast("Сначала добавь плейлист")};
}

/* ================= nav ================= */
const TABS=[
  {id:"channels",t:"Каналы",svg:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8"/>'},
  {id:"guide",t:"Гид",svg:'<path d="M4 6h16M4 12h16M4 18h10"/>'},
  {id:"favs",t:"Избранное",svg:'<path d="M12 20.5s-7.2-4.7-9.3-8.8C1.2 8.7 3 5.4 6.3 5.4c1.9 0 3.2 1 4 2.2h3.4c.8-1.2 2.1-2.2 4-2.2 3.3 0 5.1 3.3 3.6 6.3-2.1 4.1-9.3 8.8-9.3 8.8z"/>'},
  {id:"settings",t:"Настройки",svg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'}
];
function renderNav(){
  $("#nav").innerHTML=TABS.map(t=>`<button class="navi${t.id==="channels"?" on":""}" data-t="${t.id}"><svg viewBox="0 0 24 24">${t.svg}</svg>${t.t}</button>`).join("");
  const bs=$("#nav").querySelectorAll(".navi");
  for(let i=0;i<bs.length;i++)bs[i].onclick=()=>switchTab(bs[i].dataset.t);
}
function switchTab(id){
  const ns=document.querySelectorAll(".navi");
  for(let i=0;i<ns.length;i++)ns[i].classList.toggle("on",ns[i].dataset.t===id);
  const ts=document.querySelectorAll(".tab");
  for(let i=0;i<ts.length;i++)ts[i].classList.toggle("on",ts[i].id==="tab-"+id);
  if(id==="guide")renderGuide();
  if(id==="favs")renderFavs();
  if(id==="settings")renderSettings();
  window.scrollTo(0,0);
}
$("#tbSet").onclick=()=>switchTab("settings");
$("#tbSearch").onclick=()=>{switchTab("channels");const s=$("#searchBox");s.style.display=s.style.display==="none"?"block":"none";if(s.style.display!=="none")$("#q").focus()};
$("#q").addEventListener("input",e=>{query=e.target.value;renderGrid()});

if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
boot();
</script>
